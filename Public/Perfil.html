<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vive Libro - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nogal: #3b2a20;
            --kraft: #8f6a4a;
            --arcilla: #a8553a;
            --musgo: #5f6b3c;
            --pergamino: #f1e8d6;
            --arena: #e2d4b9;
            --papel: #fbf6ea;
        }
        body {
            background: var(--pergamino);
            color: var(--nogal);
            font-family: "Nunito Sans", system-ui, sans-serif;
            line-height: 1.55;
            min-height: 100vh;
        }
        h1, h4 { font-family: "Fraunces", Georgia, serif; }

        .encabezado { background: var(--nogal); color: var(--pergamino); padding: 2.5rem 1rem 2rem; text-align: center; }
        .encabezado h1 { font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0; }
        .encabezado p { color: var(--arena); margin: .4rem 0 0; font-size: 1.1rem; }
        .divisor { width: 100%; height: 14px; background: var(--kraft); }

        .card { background: var(--papel); border: 1px solid var(--arena); border-radius: 1rem; box-shadow: 0 6px 18px rgba(59,42,32,.12); }
        .card-body { padding: 2rem; }

        .cabecera-perfil { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--arena); }
        .cabecera-perfil h4 { font-weight: 600; font-size: 1.6rem; }
        .avatar {
            width: 64px; height: 64px; flex: none; border-radius: 50%;
            background: var(--musgo); color: var(--papel); border: 4px solid var(--arena);
            display: flex; align-items: center; justify-content: center;
            font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 1.5rem;
        }

        .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.5rem; }
        .dato { display: flex; flex-direction: column; min-width: 0; }
        .dato-etiqueta { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--kraft); }
        .dato-valor { font-size: 1.05rem; overflow-wrap: anywhere; }
        @media (max-width: 575px) { .datos { grid-template-columns: 1fr; } }

        .form-label { font-weight: 700; font-size: .9rem; }
        .form-control, .form-select { background-color: #fffdf7; border-color: var(--arena); }
        .form-control[readonly] { background-color: var(--pergamino); color: var(--kraft); }
        .form-control:focus, .form-select:focus { border-color: var(--musgo); box-shadow: 0 0 0 .2rem rgba(95,107,60,.25); }
        .form-text { color: var(--kraft); }

        .btn-dark { background: var(--arcilla); border-color: var(--arcilla); color: #fff; font-weight: 700; padding: .6rem 1rem; }
        .btn-dark:hover, .btn-dark:focus { background: #8c4430; border-color: #8c4430; color: #fff; }
        .btn-outline-secondary { color: var(--musgo); border-color: var(--musgo); font-weight: 700; padding: .6rem 1rem; }
        .btn-outline-secondary:hover { background: var(--musgo); border-color: var(--musgo); color: #fff; }

        .aviso { border-radius: .75rem; padding: .75rem 1rem; margin-bottom: 1rem; font-weight: 600; }
        .aviso-error { background: #f6ddd6; color: #7a2a1b; border: 1px solid #e3b4a8; }
        .aviso-ok { background: #e3e8d2; color: #3f4a22; border: 1px solid #c3cca3; }

        /* Menú redondo arriba a la derecha */
        .encabezado { position: relative; }
        .menu-usuario { position: absolute; top: 1rem; right: 1rem; z-index: 10; }
        .btn-perfil {
            width: 52px; height: 52px; padding: 0; border-radius: 50%;
            background: var(--papel); border: 3px solid var(--kraft);
            font-size: 1.5rem; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,.3);
            transition: transform .15s, background .15s;
        }
        .btn-perfil:hover, .btn-perfil:focus, .btn-perfil.show { background: var(--arena); transform: scale(1.06); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
        .menu-usuario .dropdown-menu {
            background: var(--papel); border: 1px solid var(--arena); border-radius: .75rem;
            box-shadow: 0 6px 18px rgba(59,42,32,.25); padding: .4rem; min-width: 13rem; margin-top: .5rem;
        }
        .menu-usuario .dropdown-item { border-radius: .5rem; font-weight: 700; color: var(--nogal); padding: .5rem .8rem; }
        .menu-usuario .dropdown-item:hover, .menu-usuario .dropdown-item:focus { background: var(--arena); color: var(--nogal); }
        .menu-usuario .dropdown-item.salir { color: #9a3324; }
        .menu-usuario .dropdown-divider { border-color: var(--arena); }
    </style>
</head>
<body>

    <header class="encabezado">
        
        <div class="menu-usuario dropdown">
            <button class="btn btn-perfil" type="button" id="menuUsuario"
                    data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menú de usuario" title="Mi cuenta">
                <span aria-hidden="true">👤</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
                <li><a class="dropdown-item" href="index.html">🏠 Inicio</a></li>
                <li><a class="dropdown-item" href="Politicas.html">📄 Política de privacidad</a></li>
                <li id="itemAdmin" class="d-none"><a class="dropdown-item" href="Admin.html">🛠️ Administrar</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button type="button" class="dropdown-item salir" onclick="CerrarSesion()">🚪 Cerrar sesión</button></li>
            </ul>
        </div>
        <h1>Vive Libro</h1>
        <p>Tu perfil de lector</p>
    </header>
    <div class="divisor"></div>

    <div class="container my-5" style="max-width: 560px;">

        <div id="aviso" class="aviso d-none" role="alert"></div>

        <div class="card">
            <div class="card-body">

                <div class="cabecera-perfil">
                    <div id="avatar" class="avatar" aria-hidden="true"></div>
                    <div>
                        <h4 id="nombreCompleto" class="mb-0"></h4>
                        <span id="correoCabecera" class="text-muted"></span>
                    </div>
                </div>

                
                <div id="vistaPerfil">
                    <div class="datos">
                        <div class="dato"><span class="dato-etiqueta">Nombre</span><span class="dato-valor" id="vNombre"></span></div>
                        <div class="dato"><span class="dato-etiqueta">Apellido</span><span class="dato-valor" id="vApellido"></span></div>
                        <div class="dato"><span class="dato-etiqueta">Celular</span><span class="dato-valor" id="vCelular"></span></div>
                        <div class="dato"><span class="dato-etiqueta">Tipo de documento</span><span class="dato-valor" id="vTipoDocumento"></span></div>
                        <div class="dato"><span class="dato-etiqueta">Documento</span><span class="dato-valor" id="vDocumento"></span></div>
                        <div class="dato"><span class="dato-etiqueta">Correo</span><span class="dato-valor" id="vEmail"></span></div>
                    </div>

                    <button type="button" class="btn btn-dark w-100 mt-4" id="btnEditar" onclick="EditarPerfil()">
                        <i class="bi bi-pencil me-2"></i>Editar perfil
                    </button>
                </div>

                
                <div id="vistaEdicion" class="d-none">
                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="pNombre" class="form-label">Nombre</label>
                            <input type="text" id="pNombre" class="form-control">
                        </div>
                        <div class="col-sm-6">
                            <label for="pApellido" class="form-label">Apellido</label>
                            <input type="text" id="pApellido" class="form-control">
                        </div>
                    </div>

                    <label for="pCelular" class="form-label">Celular</label>
                    <input type="text" id="pCelular" class="form-control mb-3">

                    <div class="row g-2 mb-3">
                        <div class="col-sm-5">
                            <label for="pTipoDocumento" class="form-label">Tipo de documento</label>
                            <select id="pTipoDocumento" class="form-select">
                                <option value="1">C.C</option>
                                <option value="2">T.I</option>
                                <option value="3">Pasaporte</option>
                                <option value="4">C.E</option>
                            </select>
                        </div>
                        <div class="col-sm-7">
                            <label for="pDocumento" class="form-label">Documento</label>
                            <input type="text" id="pDocumento" class="form-control">
                        </div>
                    </div>

                    <label for="pEmail" class="form-label">Correo</label>
                    <input type="email" id="pEmail" class="form-control mb-1" readonly>
                    <div class="form-text mb-4">El correo es tu acceso y no se puede editar aquí.</div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-dark flex-fill" id="btnGuardar" onclick="GuardarPerfil()">Guardar</button>
                        <button type="button" class="btn btn-outline-secondary flex-fill" onclick="CancelarEdicion()">Cancelar</button>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="perfilFront.js"></script>

    <script>
        const TIPOS_DOCUMENTO = { 1: "C.C", 2: "T.I", 3: "Pasaporte", 4: "C.E" };

        let perfil = { nombre: "", apellido: "", celular: "", tipoDocumento: 1, documento: "", email: "" };

        const $ = (id) => document.getElementById(id);

        function MostrarAviso(tipo, texto) {
            const aviso = $("aviso");
            aviso.textContent = texto;
            aviso.className = "aviso " + (tipo === "ok" ? "aviso-ok" : "aviso-error");
        }

        function OcultarAviso() {
            $("aviso").className = "aviso d-none";
        }

        function PintarPerfil() {
            const iniciales = ((perfil.nombre[0] || "") + (perfil.apellido[0] || "")).toUpperCase();
            $("avatar").textContent = iniciales;
            $("nombreCompleto").textContent = perfil.nombre + " " + perfil.apellido;
            $("correoCabecera").textContent = perfil.email;

            $("vNombre").textContent = perfil.nombre || "—";
            $("vApellido").textContent = perfil.apellido || "—";
            $("vCelular").textContent = perfil.celular || "—";
            $("vTipoDocumento").textContent = TIPOS_DOCUMENTO[perfil.tipoDocumento] || "—";
            $("vDocumento").textContent = perfil.documento || "—";
            $("vEmail").textContent = perfil.email || "—";
        }

        function EditarPerfil() {
            OcultarAviso();
            $("pNombre").value = perfil.nombre;
            $("pApellido").value = perfil.apellido;
            $("pCelular").value = perfil.celular;
            $("pTipoDocumento").value = perfil.tipoDocumento;
            $("pDocumento").value = perfil.documento;
            $("pEmail").value = perfil.email;

            $("vistaPerfil").classList.add("d-none");
            $("vistaEdicion").classList.remove("d-none");
        }

        function CancelarEdicion() {
            OcultarAviso();
            $("vistaEdicion").classList.add("d-none");
            $("vistaPerfil").classList.remove("d-none");
        }

        async function GuardarPerfil() {
            const nuevo = {
                nombre: $("pNombre").value.trim(),
                apellido: $("pApellido").value.trim(),
                celular: $("pCelular").value.trim(),
                tipoDocumento: Number($("pTipoDocumento").value),
                documento: $("pDocumento").value.trim(),
                email: perfil.email
            };

            if (!nuevo.nombre || !nuevo.apellido || !nuevo.documento) {
                MostrarAviso("error", "Nombre, apellido y documento son obligatorios.");
                return;
            }

            const boton = $("btnGuardar");
            boton.disabled = true;
            boton.textContent = "Guardando...";

            const res = await ActualizarPerfil(nuevo);

            boton.disabled = false;
            boton.textContent = "Guardar";

            if (!res.ok) {
                MostrarAviso("error", res.error || "No se pudo guardar.");
                return;
            }

            perfil = res.perfil;
            PintarPerfil();
            CancelarEdicion();
            MostrarAviso("ok", "Perfil actualizado.");
        }

        async function CerrarSesion() {
            try {
                await supabaseClient.auth.signOut();
            } catch (e) {
                console.error("No se pudo cerrar la sesión:", e);
            }
            window.location.href = "Login.html";
        }

        (async function MostrarOpcionAdmin() {
            try {
                const { data } = await supabaseClient.rpc("es_admin");
                if (data === true) $("itemAdmin").classList.remove("d-none");
            } catch (e) { /* se queda oculto */ }
        })();

        (async function Iniciar() {
            try {
                const datos = await ObtenerPerfil();
                if (!datos) return;
                perfil = datos;
                PintarPerfil();
            } catch (e) {
                MostrarAviso("error", "No se pudo cargar tu perfil: " + e.message);
            }
        })();
    </script>
</body>
</html>
