<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vive Libro - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nogal: #3b2a20;
            --kraft: #8f6a4a;
            --arcilla: #a8553a;
            --musgo: #5f6b3c;
            --pergamino: #f1e8d6;
            --arena: #e2d4b9;
            --papel: #fbf6ea;
        }
        body {
            background: var(--pergamino);
            color: var(--nogal);
            font-family: "Nunito Sans", system-ui, sans-serif;
            line-height: 1.55;
            min-height: 100vh;
        }
        h1, h4 { font-family: "Fraunces", Georgia, serif; }

        .encabezado { background: var(--nogal); color: var(--pergamino); padding: 2.5rem 1rem 2rem; text-align: center; }
        .encabezado h1 { font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0; }
        .encabezado p { color: var(--arena); margin: .4rem 0 0; font-size: 1.1rem; }
        .divisor { width: 100%; height: 14px; background: var(--kraft); }

        .card { background: var(--papel); border: 1px solid var(--arena); border-radius: 1rem; box-shadow: 0 6px 18px rgba(59,42,32,.12); }
        .card-body { padding: 2rem; }
        .card h4 { font-weight: 600; font-size: 1.6rem; }

        .form-label { font-weight: 700; font-size: .9rem; }
        .form-control, .form-select { background-color: #fffdf7; border-color: var(--arena); }
        .form-control:focus, .form-select:focus { border-color: var(--musgo); box-shadow: 0 0 0 .2rem rgba(95,107,60,.25); }
        .form-text { color: var(--kraft); }

        .btn-dark { background: var(--arcilla); border-color: var(--arcilla); color: #fff; font-weight: 700; padding: .6rem 1rem; }
        .btn-dark:hover, .btn-dark:focus { background: #8c4430; border-color: #8c4430; color: #fff; }

        a { color: var(--musgo); font-weight: 700; }
        a:hover { color: var(--arcilla); }
    </style>
</head>
<body>

    <header class="encabezado">
        <h1>Vive Libro</h1>
        <p>Registra lo que lees y muéstranos qué te parece</p>
    </header>
    <div class="divisor"></div>

    <div class="container my-5" style="max-width: 460px;">

        
        <div id="seccionLogin" class="card">
            <div class="card-body">
                <h4 class="mb-3">Iniciar sesión</h4>

                <label for="loginEmail" class="form-label">Correo</label>
                <input type="email" id="loginEmail" class="form-control mb-3">

                <label for="loginPassword" class="form-label">Contraseña</label>
                <input type="password" id="loginPassword" class="form-control mb-4">

                <button type="button" class="btn btn-dark w-100 mb-3" onclick="IniciarSesion()">Entrar</button>

                <p class="text-center mb-0">
                    ¿olvidaste tu contraseña?
                    <a href="./Recuperar.html">recuperar contraseña</a>

                </p>

                <p class="text-center mb-0">
                    ¿No tienes cuenta?
                    <a href="#" onclick="MostrarRegistro(); return false;">Crear cuenta</a>
                </p>
            </div>
        </div>

        
        <div id="seccionRegistro" class="card d-none">
            <div class="card-body">
                <h4 class="mb-3">Crear cuenta</h4>

                <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                        <label for="rNombre" class="form-label">Nombre</label>
                        <input type="text" id="rNombre" class="form-control">
                    </div>
                    <div class="col-sm-6">
                        <label for="rApellido" class="form-label">Apellido</label>
                        <input type="text" id="rApellido" class="form-control">
                    </div>
                </div>

                <label for="rCelular" class="form-label">Celular</label>
                <input type="text" id="rCelular" class="form-control mb-3">

                <div class="row g-2 mb-3">
                    <div class="col-sm-5">
                        <label for="rTipoDocumento" class="form-label">Tipo de documento</label>
                        <select id="rTipoDocumento" class="form-select">
                            <option value="1">C.C</option>
                            <option value="2">T.I</option>
                            <option value="3">Pasaporte</option>
                            <option value="4">C.E</option>
                        </select>
                    </div>
                    <div class="col-sm-7">
                        <label for="rDocumento" class="form-label">Documento</label>
                        <input type="text" id="rDocumento" class="form-control">
                    </div>
                </div>

                <label for="rEmail" class="form-label">Correo</label>
                <input type="email" id="rEmail" class="form-control mb-3">

                <label for="rPassword" class="form-label">Contraseña</label>
                <input type="password" id="rPassword" class="form-control mb-1">
                <div class="form-text mb-3">Mínimo 6 caracteres.</div>

                <label for="rPassword2" class="form-label">Repetir contraseña</label>
                <input type="password" id="rPassword2" class="form-control mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rPoliticas" />
                    <a class="form-check-label" href="Politicas.html" target="_blank"> Acepta politicas de tratamiento de datos </a>
                </div>
                
                

                <button type="button" class="btn btn-dark w-100 mb-3" onclick="Registrar()">Crear cuenta</button>

                <p class="text-center mb-0">
                    ¿Ya tienes cuenta?
                    <a href="#" onclick="MostrarLogin(); return false;">Iniciar sesión</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="loginFront.js"></script>

</body>
</html>
